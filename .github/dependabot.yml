version: 2
updates:
- package-ecosystem: "nuget"
  directory: "/"
  schedule:
    interval: "daily"
  commit-message:
    prefix: "chore"
    prefix-development: "chore"
    include: "scope"
  groups:
    NLog:
      patterns:
        - "NLog*"
    Avalonia:
      patterns:
        - "Avalonia*"
    MicrosoftCodeAnalysis:
      patterns:
        - "Microsoft.CodeAnalysis.*"
- package-ecosystem: "nuget"
  directory: "/.config"
  schedule:
    interval: "daily"
  commit-message:
    prefix: "chore"
    prefix-development: "chore"
    include: "scope"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    # Check for updates to GitHub Actions every weekday
    interval: "daily"
    timezone: America/Chicago
  commit-message:
    prefix: "chore"
    prefix-development: "chore"
    include: "scope"
